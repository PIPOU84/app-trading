# Rapport du soir : tourne sur les serveurs de GitHub, ton PC peut rester éteint.
name: Rapport du soir

on:
  schedule:
    # Du lundi au vendredi à 21:30 UTC = 22:30 (heure d'hiver) / 23:30 (heure d'été) à Paris,
    # après la clôture de Wall Street. GitHub peut démarrer la tâche avec quelques minutes de retard.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}  # bouton « Run workflow » pour lancer un test à la main

env:
  # Dépôt PUBLIC qui héberge la page du soir (GitHub Pages). Il ne contient que l'analyse du jour.
  PAGE_REPO: ${{ github.repository_owner }}/swing-trader-page
  PAGE_URL: https://${{ github.repository_owner }}.github.io/swing-trader-page/

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r backend/requirements.txt

      - name: Mettre à jour les données, analyser et envoyer le rapport
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_PERIOD: 3y
          # Le lien n'est ajouté au message que si la page peut être publiée
          PAGE_URL: ${{ secrets.PAGES_TOKEN != '' && env.PAGE_URL || '' }}
        run: python -m app.report --site ../site

      - name: Publier la page du soir
        if: ${{ always() && hashFiles('site/index.html') != '' }}
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::notice::Secret PAGES_TOKEN absent : la page du soir n'est pas publiée."
            exit 0
          fi
          cd site
          git init -q -b main
          git config user.name "rapport-du-soir"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Page du $(date +%F)"
          # On remplace l'historique chaque soir : le dépôt reste léger
          git push -q -f "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGE_REPO}.git" main
          echo "::notice::Page publiée : ${PAGE_URL}"
